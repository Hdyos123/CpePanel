name: CpePanel
options:
  bundleIdPrefix: com.cpepanel
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CpePanel:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CpePanel
        excludes:
          - "Resources/Info.plist"
          - "Resources/Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cpepanel.app
        INFOPLIST_FILE: CpePanel/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: CpePanel/Resources/Bridging-Header.h
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
