name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CpePanel.xcodeproj \
            -scheme CpePanel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -arch arm64 \
            build

      - name: Package into IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/CpePanel.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "构建产物不存在"; ls -R build/Build/Products || true; exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 未签名包移除签名文件
          rm -rf Payload/CpePanel.app/_CodeSignature || true
          zip -qry CpePanel-unsigned.ipa Payload
          ls -lh CpePanel-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CpePanel-unsigned-ipa
          path: CpePanel-unsigned.ipa
          retention-days: 30
